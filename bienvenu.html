<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenue</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    :root{
        --ig-purple:#833AB4;
        --ig-pink:#E1306C;
        --ig-orange:#F77737;
        --ig-yellow:#FCAF45;
        --ink:#1c1c1e;
        --muted:#737373;
        --bg:#fafafa;
        --card:#ffffff;
        --border:#dbdbdb;
    }

    *{ box-sizing:border-box; }

    body{
        margin:0;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        font-family:'Inter', Arial, sans-serif;
        background:
            radial-gradient(circle at 15% 15%, rgba(131,58,180,0.10), transparent 45%),
            radial-gradient(circle at 85% 85%, rgba(247,119,55,0.10), transparent 45%),
            var(--bg);
        padding:20px;
    }

    .card{
        background:var(--card);
        padding:40px 32px 32px;
        border-radius:24px;
        text-align:center;
        width:100%;
        max-width:340px;
        border:1px solid var(--border);
        box-shadow:0 20px 45px rgba(0,0,0,0.08);
        animation:pop-in 0.5s cubic-bezier(0.2,0.8,0.2,1) both;
    }

    @keyframes pop-in{
        from{ opacity:0; transform:translateY(14px) scale(0.96); }
        to{ opacity:1; transform:translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce){
        .card{ animation:none; }
    }

    .avatar-ring{
        width:104px;
        height:104px;
        border-radius:50%;
        background:linear-gradient(45deg, var(--ig-yellow), var(--ig-orange), var(--ig-pink), var(--ig-purple));
        margin:0 auto 18px;
        padding:4px;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .avatar{
        width:100%;
        height:100%;
        border-radius:50%;
        background:var(--card);
        padding:3px;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .avatar-inner{
        width:100%;
        height:100%;
        border-radius:50%;
        background:linear-gradient(135deg,#f0f0f0,#e2e2e2);
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .avatar-inner svg{
        width:44px;
        height:44px;
        fill:#b0b0b0;
    }

    .badge{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        width:28px;
        height:28px;
        border-radius:50%;
        background:linear-gradient(45deg, var(--ig-orange), var(--ig-pink));
        margin-top:-32px;
        margin-left:64px;
        border:3px solid var(--card);
        position:relative;
    }

    .badge svg{
        width:14px;
        height:14px;
        stroke:white;
        stroke-width:3;
        fill:none;
    }

    h2{
        margin:14px 0 4px;
        font-family:'Poppins', sans-serif;
        font-weight:700;
        font-size:20px;
        color:var(--ink);
        letter-spacing:-0.2px;
    }

    p.sub{
        margin:0 auto;
        color:var(--muted);
        font-size:14px;
        line-height:1.5;
        max-width:260px;
    }

    button{
        margin-top:24px;
        padding:12px 0;
        width:100%;
        border:none;
        background:linear-gradient(45deg, var(--ig-purple), var(--ig-pink), var(--ig-orange));
        background-size:200% 200%;
        color:white;
        font-family:'Inter', sans-serif;
        font-weight:600;
        font-size:15px;
        border-radius:12px;
        cursor:pointer;
        transition:transform 0.15s ease, box-shadow 0.15s ease, background-position 0.4s ease;
        box-shadow:0 8px 20px rgba(225,48,108,0.25);
    }

    button:hover{
        transform:translateY(-1px);
        background-position:100% 50%;
        box-shadow:0 10px 24px rgba(225,48,108,0.32);
    }

    button:active{
        transform:translateY(0);
    }

    .divider{
        margin:22px 0 0;
        border:none;
        border-top:1px solid var(--border);
    }

    .footnote{
        margin-top:14px;
        font-size:12px;
        color:#a8a8a8;
    }
</style>
</head>

<body>

<div class="card">

    <div class="avatar-ring">
        <div class="avatar">
            <div class="avatar-inner">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
            </div>
        </div>
    </div>

   

    <h2 id="username">Bienvenue</h2>

    <p class="sub">Ton compte a été créé avec succès. Tu es prêt à commencer l'aventure.</p>

    <button id="okBtn">Continuer</button>

    <hr class="divider">
    <p class="footnote">Ravis de t'avoir parmi nous</p>

</div>

<script>
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) {
        window.location.replace("index.html");
    }
    if(user){
        document.getElementById("username").innerText =
            "Bienvenue " + user.nom + " " + user.prenom;
    }

    document.getElementById("okBtn").addEventListener("click", () => {
        window.location.href = "home.html";
    });
</script>

</body>
</html>
