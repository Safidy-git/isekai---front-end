<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>

    <link rel="stylesheet" href="assets/css/connexion.css">
    <link rel="stylesheet" href="assets/fontawesome-free-6.6.0-web/css/all.css">
</head>

<body>

<div class="page">

    <div class="card">

        <!-- LEFT SIDE -->
        <div class="left">

            <div class="overlay"></div>

            <img src="assets/image/intro-ezgif.com-gif-maker (1).gif" alt="illustration">

            <div class="story-block block1">
                <div class="story">
                    <img src="assets/image/Social Media Frame Portrait Prompt.jfif">
                </div>
                <div class="story-text">
                    <span class="name">Emma</span>
                    <span class="msg">t’a envoyé un message</span>
                </div>
            </div>

            <div class="story-block block3">
                <div class="story">
                    <img src="assets/image/Айдентика и фирменный стиль для бренда одежды _ логотип.jfif">
                </div>
                <div class="story-text">
                    <span class="name">Noah</span>
                    <span class="msg">t’a envoyé un message</span>
                </div>
            </div>

            <div class="story-block block4">
                <div class="story">
                    <img src="assets/image/Айдентика и фирменный стиль для бренда одежды _ логотип.jfif">
                </div>
                <div class="story-text">
                    <span class="name">Mia</span>
                    <span class="msg">a réagi à ton post</span>
                </div>
            </div>

            <div class="float-notif notif1">
                <i class="fa-solid fa-bell"></i> Nouveau like
            </div>

            <div class="float-notif notif3">
                <i class="fa-solid fa-user-plus"></i> Nouvelle follow
            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="right">

            <div class="top-text">
                <p>Nouveau ici ? <a href="inscription.html">Crée ton compte</a></p>
            </div>

            <h1>Content de te revoir</h1>
            <p class="subtitle">Reconnecte-toi à ton univers</p>

            <form>

                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Email ou pseudo">
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Mot de passe">
                    <i class="fa-solid fa-eye-slash toggle"></i>
                </div>

                

                <button type="submit" class="btn">Se connecter</button>

                

            </form>

        </div>

    </div>

</div>

<script src="assets/js/connexion/step.js"></script>

</body>
</html>
